server:
  port: ${SERVER_PORT:8081}

spring:
  # Load backend/.env (or a repo-root .env) so the values documented in docs/SETUP.md
  # actually reach the app. Without this the file is read by nothing and every setting
  # in it -- including OPENAI_API_KEY -- is silently ignored.
  config:
    import: optional:file:.env[.properties],optional:file:./backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:owndeck;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  jwt:
    secret: ${APP_JWT_SECRET:owndeck-default-jwt-secret-change-this-to-a-long-random-value}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:604800000}
  storage:
    location: ${APP_STORAGE_LOCATION:uploads}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8081}
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179}
  ocr:
    tessdata-path: ${OCR_TESSDATA_PATH:.}
    # Extra directories to search for the libtesseract native library. The common
    # Homebrew/Linux locations are probed automatically; set this only if yours differs.
    native-lib-path: ${OCR_NATIVE_LIB_PATH:}
  alert:
    cron: ${APP_ALERT_CRON:0 0 9 * * *}
    email:
      enabled: ${APP_ALERT_EMAIL_ENABLED:false}
      from-address: ${APP_ALERT_EMAIL_FROM_ADDRESS:no-reply@owndeck.local}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

logging:
  level:
    root: INFO
